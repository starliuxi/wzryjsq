<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>工时批量计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 100%);
            min-height: 100vh;
            font-family: 'Courier New', monospace, system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 16px;
            color: #333;
        }
        .wrap{
            max-width: 1000px;
            margin:0 auto;
        }
        .card{
            background:#fff;
            border-radius:12px;
            padding:14px;
            margin-bottom:12px;
            box-shadow:0 2px 8px #00000022;
        }
        .input-row{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            align-items:center;
            margin-bottom:10px;
        }
        .input-row label{
            white-space:nowrap;
        }
        input{
            padding:6px 8px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
        }
        textarea{
            width:100%;
            height:120px;
            padding:8px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
        }
        button{
            padding:8px 14px;
            border:none;
            background:#2b7cd3;
            color:white;
            border-radius:6px;
            font-size:15px;
            cursor:pointer;
        }
        .table-wrap{
            overflow-x:auto;
        }
        table{
            width:100%;
            border-collapse: collapse;
            font-size:13px;
        }
        th,td{
            border:1px solid #aaa;
            padding:5px;
            text-align:center;
            position:relative;
        }
        th{
            background:#eef6ff;
        }
        /* 红圈白字 连标，单元格内右上角，不溢出格子 */
        .tag-lian{
            position:absolute;
            top:2px;
            right:2px;
            width:14px;
            height:14px;
            border-radius:50%;
            background:#d92222;
            color:white;
            font-size:10px;
            line-height:14px;
        }
        .warn{
            color:#c82423;
            margin:8px 0;
        }
        .sum-text{
            line-height:1.7;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h3>参数设置</h3>
        <div class="input-row">
            <label>底薪：</label>
            <input id="basePay" type="number" value="4000">
            <label>时薪单价：</label>
            <input id="hourPrice" type="number" step="0.01" value="">
            <label>额外补贴(房补/绩效)：</label>
            <input id="extraSubsidy" type="number" value="">
            <label>饭补天数：</label>
            <input id="mealDay" type="number" value="">
        </div>
        <div class="input-row">
            <label>饭补每天：</label>
            <input id="mealPrice" type="number" value="13">
            <label>入职月份：</label>
            <input id="entryMonth" type="number" value="9">
            <label>当前月份：</label>
            <input id="curMonth" type="number" value="11">
        </div>
    </div>

    <div class="card">
        <h3>批量输入班次</h3>
        <p style="font-size:12px;color:#666;margin:4px 0;">格式示例：1 7-16:30，连班末尾加字母 l → 22 7-23:30l</p>
        <textarea id="batchInput"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;">
            <button onclick="calcAll()">开始计算</button>
            <button onclick="clearTable()">清空表格</button>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>上下班</th>
                        <th>总时长(h)</th>
                        <th>扣饭后(h)</th>
                        <th>当日工资</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div id="warnBox" class="warn"></div>
        <div id="sumBox" class="sum-text"></div>
    </div>
</div>

<script>
const tbody = document.querySelector('#resultTable tbody');
const warnBox = document.getElementById('warnBox');
const sumBox = document.getElementById('sumBox');

// 数字格式化：去掉末尾多余 .00
function formatNum(n){
    if(isNaN(n)) return '0';
    let s = Number(n).toFixed(2);
    if(s.endsWith('.00')) return s.slice(0,-3);
    return s;
}

// 时间字符串转分钟 如 "7" → 420，"16:30" → 990
function timeToMin(str){
    let arr = str.split(':');
    return Number(arr[0])*60 + Number(arr[1]||0);
}

// 计算个税：9月入职累计预扣，3%档
function calcTax(taxable){
    return taxable * 0.03;
}

function calcAll(){
    warnBox.innerText = '';
    tbody.innerHTML = '';
    const basePay = Number(document.getElementById('basePay').value)||0;
    const hourPrice = Number(document.getElementById('hourPrice').value)||0;
    const extraSubsidy = Number(document.getElementById('extraSubsidy').value)||0;
    const mealDayInput = Number(document.getElementById('mealDay').value);
    const mealPrice = Number(document.getElementById('mealPrice').value)||0;
    const entryMonth = Number(document.getElementById('entryMonth').value)||9;
    const curMonth = Number(document.getElementById('curMonth').value)||11;
    const batchText = document.getElementById('batchInput').value.trim();
    if(!batchText){
        alert('请粘贴班次数据');
        return;
    }
    const lines = batchText.split('\n').map(x=>x.trim()).filter(x=>x);
    let totalWorkHour = 0;
    let totalDailyWage = 0;
    for(let line of lines){
        let parts = line.split(/\s+/);
        let dayNum = parts[0];
        let timeStr = parts[1];
        let isLian = timeStr.toLowerCase().endsWith('l');
        if(isLian) timeStr = timeStr.slice(0,-1);
        let [startStr,endStr] = timeStr.split('-');
        let startMin = timeToMin(startStr);
        let endMin = timeToMin(endStr);
        let allMin = endMin - startMin;
        let workHourAll = allMin / 60;
        let finalHour;
        if(isLian){
            // 连班扣半小时吃饭
            finalHour = (allMin - 30)/60;
        }else{
            finalHour = workHourAll;
        }
        let dayWage = finalHour * hourPrice;
        totalWorkHour += finalHour;
        totalDailyWage += dayWage;

        // 生成行
        let tr = document.createElement('tr');
        let tdDay = document.createElement('td');
        tdDay.innerText = dayNum;
        if(isLian){
            let spanTag = document.createElement('span');
            spanTag.className = 'tag-lian';
            spanTag.innerText = '连';
            tdDay.appendChild(spanTag);
        }
        tr.appendChild(tdDay);

        let tdTime = document.createElement('td');
        tdTime.innerText = startStr + '-' + endStr + (isLian?'(连)':'');
        tr.appendChild(tdTime);

        let tdAllH = document.createElement('td');
        tdAllH.innerText = formatNum(workHourAll);
        tr.appendChild(tdAllH);

        let tdAfterEat = document.createElement('td');
        tdAfterEat.innerText = formatNum(finalHour);
        tr.appendChild(tdAfterEat);

        let tdWage = document.createElement('td');
        tdWage.innerText = formatNum(dayWage);
        tr.appendChild(tdWage);
        tbody.appendChild(tr);
    }
    // 饭补提醒
    if(isNaN(mealDayInput) || mealDayInput <=0){
        warnBox.innerText = '⚠️ 饭补天数还没有填写';
    }
    const mealTotal = (mealDayInput||0) * mealPrice;
    const monthGross = basePay + totalDailyWage + extraSubsidy + mealTotal;
    // 累计应税（简易）
    const monthsCount = curMonth - entryMonth + 1;
    const taxable = monthGross * monthsCount - 5000 * monthsCount;
    const tax = calcTax(taxable / monthsCount) * monthsCount;
    const netPay = monthGross - tax;

    sumBox.innerHTML = `
总工时：${formatNum(totalWorkHour)} h<br>
工时工资合计：${formatNum(totalDailyWage)} 元<br>
底薪：${formatNum(basePay)} 元<br>
额外补贴(房补/绩效)：${formatNum(extraSubsidy)} 元<br>
饭补：${formatNum(mealTotal)} 元（${mealDayInput||0}天 × ${mealPrice}元）<br>
✅ 本月应发合计：${formatNum(monthGross)} 元<br>
个税（累计3%）：${formatNum(tax)} 元<br>
✅ 本月实发工资：<b style="color:#c82423;font-size:16px">${formatNum(netPay)}</b> 元
    `
}

function clearTable(){
    tbody.innerHTML = '';
    warnBox.innerText = '';
    sumBox.innerText = '';
}
</script>
</body>
</html>
